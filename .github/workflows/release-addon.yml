name: Package Kodi Addon

on:
  push:
    branches:
      - nexus
    paths:
      - addon.xml
      - .github/workflows/release-addon.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: addon-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read addon metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ADDON_ID=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("addon.xml").getroot().get("id"))')
          VERSION=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("addon.xml").getroot().get("version"))')
          [[ "$ADDON_ID" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid addon id: $ADDON_ID" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid addon version: $VERSION" >&2; exit 1; }
          echo "addon_id=$ADDON_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging $ADDON_ID $VERSION"

      - name: Check whether this version is already released
        id: guard
        shell: bash
        env:
          ADDON_ID: ${{ steps.meta.outputs.addon_id }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ZIP_NAME="${ADDON_ID}-${VERSION}.zip"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            if gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -Fxq "$ZIP_NAME"; then
              echo "Release $VERSION already contains $ZIP_NAME; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release $VERSION exists without $ZIP_NAME; the zip will be uploaded."
          else
            echo "Release $VERSION does not exist; it will be created."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build addon zip
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          ADDON_ID: ${{ steps.meta.outputs.addon_id }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ZIP_NAME="${ADDON_ID}-${VERSION}.zip"
          ZIP_PATH="$GITHUB_WORKSPACE/dist/$ZIP_NAME"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$ADDON_ID" dist

          git archive --format=tar HEAD | tar -x -C "$STAGE/$ADDON_ID"

          rm -rf \
            "$STAGE/$ADDON_ID/.github" \
            "$STAGE/$ADDON_ID/.gitignore" \
            "$STAGE/$ADDON_ID/.gitattributes" \
            "$STAGE/$ADDON_ID/.vscode" \
            "$STAGE/$ADDON_ID/.idea" \
            "$STAGE/$ADDON_ID/dist"
          find "$STAGE/$ADDON_ID" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "$STAGE/$ADDON_ID" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '.DS_Store' -o -name '*_report.txt' \) -delete

          (cd "$STAGE" && zip -rq "$ZIP_PATH" "$ADDON_ID")

          echo "Contents of $ZIP_NAME:"
          unzip -l "$ZIP_PATH"

          unzip -Z1 "$ZIP_PATH" | grep -Fxq "$ADDON_ID/addon.xml"
          if unzip -Z1 "$ZIP_PATH" | grep -Eq '(^|/)\.github/|(^|/)\.gitignore$|(^|/)\.gitattributes$|(^|/)__pycache__/|\.py[co]$|(^|/)\.DS_Store$|(^|/)dist/|_report\.txt$'; then
            echo "Repository-only files leaked into the zip" >&2
            exit 1
          fi

      - name: Generate release notes
        id: notes
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          PREV_TAG=$(git tag --list --sort=-version:refname '[0-9]*.[0-9]*.[0-9]*' | grep -Fxv "$VERSION" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_SHA}"
            COMPARE="**完整变更**: https://github.com/${REPO}/compare/${PREV_TAG}...${VERSION}"
          else
            RANGE="$GITHUB_SHA"
            COMPARE=""
          fi
          export RANGE VERSION COMPARE NOTES
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import unicodedata

          GROUPS = (
              ("新增", {"sparkles", "✨", "heavy_plus_sign", "➕"}),
              ("修复", {"bug", "🐛", "ambulance", "🚑", "symbols", "🔠"}),
              ("优化", {"zap", "⚡", "recycle", "♻️", "arrow_up", "⬆️"}),
              ("删除", {"fire", "🔥", "wastebasket", "🗑️"}),
          )
          SKIP = {"bookmark", "🔖", "construction_worker", "👷", "robot", "🤖", "hammer", "🔨"}
          MAINTENANCE = re.compile(r"^(?:tidy(?:\s+up)?|version\s+bump|bump\s+version|wip)$", re.I)
          SHORTCODE = re.compile(r"^:([a-z_]+):\s*")
          REFERENCE = re.compile(
              r"\s*(?:[-–—]\s*(?:(?:Refs|Resolves|Fixes|Closes)\s+)?(?:[\w.-]+/[\w.-]+)?#\d+"
              r"|\((?:(?:Refs|Resolves|Fixes|Closes)\s+)?#\d+\))\s*$",
              re.I,
          )
          SYMBOL = {"So", "Sk", "Sm", "Cf", "Mn"}


          def get_marker(subject):
              match = SHORTCODE.match(subject)
              if match:
                  return match.group(1), subject[match.end():]
              prefix = ""
              for char in subject:
                  if ord(char) > 127 and unicodedata.category(char) in SYMBOL:
                      prefix += char
                  else:
                      break
              if not prefix:
                  return "", subject
              return prefix, subject[len(prefix):].lstrip()


          def get_entry(subject):
              marker, text = get_marker(subject)
              while True:
                  trimmed = REFERENCE.sub("", text)
                  if trimmed == text:
                      break
                  text = trimmed
              text = text.strip()
              if text and text[0].islower():
                  text = text[0].upper() + text[1:]
              return marker, text


          def get_subjects():
              result = subprocess.run(
                  [
                      "git",
                      "log",
                      "--no-merges",
                      "--max-count=100",
                      "--pretty=format:%s",
                      os.environ["RANGE"],
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return result.stdout.splitlines()


          def get_buckets():
              buckets = {name: [] for name, _ in GROUPS}
              for subject in get_subjects():
                  marker, text = get_entry(subject)
                  if not text or marker in SKIP or MAINTENANCE.match(text):
                      continue
                  name = next((n for n, keys in GROUPS if marker in keys), "优化")
                  if text not in buckets[name]:
                      buckets[name].append(text)
              return buckets


          def get_notes():
              lines = ["## 变更记录 " + os.environ["VERSION"], ""]
              buckets = get_buckets()
              for name, _ in GROUPS:
                  if not buckets[name]:
                      continue
                  lines += ["### " + name, ""] + ["- " + t for t in buckets[name]] + [""]
              if not any(buckets.values()):
                  lines += ["- 内部维护与版本更新", ""]
              compare = os.environ.get("COMPARE", "")
              if compare:
                  lines.append(compare)
              return "\n".join(lines).rstrip() + "\n"


          with open(os.environ["NOTES"], "w", encoding="utf-8", newline="\n") as handle:
              handle.write(get_notes())
          PY
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          cat "$NOTES"

      - name: Create or update GitHub release
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          ADDON_ID: ${{ steps.meta.outputs.addon_id }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          ZIP="dist/${ADDON_ID}-${VERSION}.zip"
          NOTES="$NOTES_PATH"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$ZIP" --clobber
            gh release edit "$VERSION" --notes-file "$NOTES"
            echo "Uploaded $ZIP and refreshed notes on existing release $VERSION."
          elif git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" "$ZIP" --title "$VERSION" --notes-file "$NOTES"
            echo "Created release $VERSION from existing tag."
          else
            gh release create "$VERSION" "$ZIP" --title "$VERSION" --target "$GITHUB_SHA" --notes-file "$NOTES"
            echo "Created release $VERSION."
          fi
